name: CodeQL

# Code scanning for the browser script, the sidecar, the C# plugin and these workflow files. On a public repository the
# results go to the Security tab. A private repository on a personal account has no code
# scanning (that needs GitHub Advanced Security), so there the findings become annotations
# and a table in the run summary, the run fails on any warning or error (notes, CodeQL's
# low-confidence findings, are only shown), and the SARIF files are kept as an artifact.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"  # Mondays, for queries added since the last push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this repository private?
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: echo "private=$(gh api "repos/$REPO" --jq .private)" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ steps.repo.outputs.private == 'true' && 'never' || 'always' }}
          output: sarif-results

      - name: Report findings (private repository)
        if: steps.repo.outputs.private == 'true'
        shell: python3 {0}
        run: |
          import glob, json, os, sys

          def esc(text):  # workflow-command escaping
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          rows, failing = [], 0
          for path in glob.glob("sarif-results/*.sarif"):
              with open(path) as f:
                  runs = json.load(f)["runs"]
              for run in runs:
                  for res in run.get("results", []):
                      where = res["locations"][0]["physicalLocation"]
                      file = where["artifactLocation"]["uri"]
                      line = where.get("region", {}).get("startLine", 1)
                      text = res["message"]["text"]
                      level = {"error": "error", "warning": "warning"}.get(res.get("level"), "notice")
                      failing += level != "notice"
                      print(f"::{level} file={file},line={line},title={res['ruleId']}::{esc(text)}")
                      rows.append(f"| `{res['ruleId']}` | `{file}:{line}` | {text.splitlines()[0]} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### CodeQL ({os.environ['LANGUAGE']}): {len(rows)} finding(s)\n\n")
              if rows:
                  summary.write("| Rule | Where | Message |\n|---|---|---|\n" + "\n".join(rows) + "\n")
          sys.exit(1 if failing else 0)
        env:
          LANGUAGE: ${{ matrix.language }}

      - name: Keep the SARIF files
        if: always() && steps.repo.outputs.private == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore
