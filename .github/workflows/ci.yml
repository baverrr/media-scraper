# Tests both components on every push and pull request.
# On main: publishes the sidecar image to GitHub Container Registry as :edge.
# On a vX.Y.Z tag: publishes the image as :X.Y.Z and :latest, a GitHub release with the plugin
# zip, and the Jellyfin plugin repository (manifest.json) on GitHub Pages.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/local-broadcast-sidecar

jobs:
  sidecar:
    name: Sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false # this workflow also runs on v* tags; keep a PR-written cache out of release runs
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      # For the media-scraper.js browser tests (skipped when no browser is installed).
      - run: npx playwright install --with-deps chromium
      - run: npm test

  plugin:
    name: Plugin build and tests
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Read version from build.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' build.yaml)
          test -n "$version" || { echo "::error file=build.yaml::No version found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches build.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # v1.1.1 <-> 1.1.1.0
          if [ "${TAG#v}.0" != "$VERSION" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error file=build.yaml::Tag $TAG does not match build.yaml version $VERSION"
            exit 1
          fi

      - name: Build plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish Jellyfin.Plugin.LocalBroadcast -c Release -o dist
          -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Run tests
        run: dotnet test Jellyfin.Plugin.LocalBroadcast.Tests -c Release --logger "console;verbosity=normal"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          (cd dist && zip -q -X "../release/local-broadcast_${VERSION}.zip" Jellyfin.Plugin.LocalBroadcast.dll)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-broadcast-plugin
          path: release/
          if-no-files-found: error

  image:
    name: Sidecar image
    needs: sidecar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 too (Raspberry Pi, ARM servers); the image uses Chromium there (no Chrome for arm64).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${REF_NAME#v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A release image (v* tag) is built from scratch, so layers cached by an earlier run can't end up in it.
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: Release and plugin repository
    needs: [plugin, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kept on purpose: the gh-pages step below pushes with git, using this token. This job
          # uploads no artifact, so the token can't leak through one.
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-broadcast-plugin
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          notes=$(awk '/^changelog: >/{f=1;next} f&&/^  /{sub(/^  /,"");printf "%s ",$0;next} f{exit}' build.yaml)
          printf '%s\n\nInstall: add the plugin repository `https://%s.github.io/%s/manifest.json` in Jellyfin, and run the sidecar image `%s:%s` with `API_KEY` set (see the README).\n' \
            "$notes" "$OWNER" "$REPO_NAME" "$IMAGE" "${TAG#v}" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip --clobber
          else
            gh release create "$TAG" release/*.zip --title "$TAG" --notes-file notes.md --verify-tag
          fi

      - name: Update the plugin repository on GitHub Pages (gh-pages branch)
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plugin.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          zip="release/local-broadcast_${VERSION}.zip"
          url="https://github.com/${REPOSITORY}/releases/download/${TAG}/local-broadcast_${VERSION}.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages > /dev/null 2>&1; then
            git worktree add pages origin/gh-pages
            git -C pages checkout -B gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          python3 -I scripts/manifest.py build.yaml pages/manifest.json "$zip" "$url"
          git -C pages add manifest.json
          git -C pages commit -m "Plugin repository: Local Broadcast ${VERSION}"
          git -C pages push origin gh-pages
