# Keeps the SHA-pinned actions current. The sidecar's base image and its playwright package are
# left out: their versions have to move together, which Dependabot can't do across ecosystems.
version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7 # let a new release settle before an update PR
    directory: /
    schedule: { interval: weekly }
