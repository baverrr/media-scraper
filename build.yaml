changelog: >
  Wider coverage: the Denver market now reaches every TV market covering part
  of Colorado plus Cheyenne (30 stations, 13 enabled, up from 6), including
  Gray Television stations such as KKTV 11, whose streams now play (also
  behind DNS ad blockers). Local games prefer Denver stations. Use "Load this
  market's stations and teams" in the settings to get the new stations.
