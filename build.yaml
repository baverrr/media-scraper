artifacts:
- "Jellyfin.Plugin.LocalBroadcast.dll"
changelog: >
  Keep streams ready: a new setting has the sidecar find every enabled
  station's stream ahead of time and renew it in the background, so tuning in
  is instant instead of taking 15 to 20 seconds. A station with nothing to
  play is checked less and less often. KOAT 7 streams its newscasts from
  its NowCast page, and ION (KPXC) plays ION's national feed from its free
  Pluto TV channel (19 stations enabled; use "Load this market's stations
  and teams" to pick them up). Setup steps for Windows (PowerShell) and macOS
  in the README.
