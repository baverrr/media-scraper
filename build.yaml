artifacts:
- "Jellyfin.Plugin.LocalBroadcast.dll"
changelog: >
  Station sign-ins: for a station that streams only to signed-in (free)
  accounts, save the account in the station's settings, or have the account
  created for you when the site's sign-up form asks only for an email and
  password. The sidecar keeps it encrypted, signs in through the site's form,
  and stops at a CAPTCHA. Any confirmation email is yours to open.
