changelog: >
  Keep streams ready fixes: the background warm-up runs one station at a time
  and always leaves room for someone tuning in or a local game; stations whose
  stream links expire within minutes are renewed at most every 10 minutes; a
  station edited while it was being warmed is tried with its new settings
  right away; turning the setting on or off no longer refreshes the guide.
  Signed-in stations check only the page itself (not embedded widgets) for a
  sign-in prompt before signing in again.
