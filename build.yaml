changelog: >
  Station logos in Live TV and the guide for all 30 bundled stations. Stations
  that stream only during newscasts (KOAT, KGWN) list their newscasts in the
  guide at their times, with "Not streaming" between them. Stations set up by
  an earlier version get their logos and newscast times automatically.
