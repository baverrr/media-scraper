overview: "Local TV stations' free web streams in Live TV, local sports first"
description: >
  Adds your market's local TV stations to Live TV as an M3U tuner with a guide,
  using the free live streams on the stations' own websites (found by the
  local-broadcast sidecar, a small Docker container). Stations airing a local
  team's game come first, and a Local Sports channel always plays the station
  that has the game.
category: "LiveTV"
