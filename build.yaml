changelog: >
  Station logos come from the sidecar: it fetches each one itself, with a
  User-Agent that Wikimedia accepts, and keeps it for a week. Jellyfin's own
  downloads were refused by Wikimedia, so CW2, 9NEWS, FOX21, FOX31 and
  Estrella TV showed no logo.
