changelog: >
  Coverage area: set a maximum distance and your location (or use this
  device's location) to keep only nearby stations in Live TV; each station's
  city and distance show in the settings. Stations set up by an earlier
  version get their locations automatically.
  KWGN CW2, KDVR FOX31 and KXRM FOX21 stream again (16 stations enabled); use
  "Load this market's stations and teams" to turn them on.
