archgram: 1
title: Local Broadcast for Jellyfin
description: >-
  The plugin's settings page saves stations and teams; the sync service
  pushes them to the sidecar and registers the sidecar with Jellyfin Live TV
  as an M3U tuner and XMLTV guide. When Live TV asks for a channel, the
  sidecar's server has the resolver open the station's page in headless
  Chrome with media-scraper.js loaded first, finds the live stream, and
  proxies it back. For a station whose player is Anvato, anvato.js keeps the
  player's video ID from that first visit and afterwards asks Anvato's video
  API for the stream directly, with no browser. For local sports the sidecar
  reads team schedules from ESPN.
direction: down
nodes:
  - { id: settings, kind: browser, label: Settings page, note: "stations, teams, coverage", frame: plugin, source: ../../Jellyfin.Plugin.LocalBroadcast/Configuration/configPage.html }
