  - { id: registrar, kind: service, label: LiveTvRegistrar, note: adds tuner + guide, tech: dotnet, frame: plugin, source: ../../Jellyfin.Plugin.LocalBroadcast/LiveTv/LiveTvRegistrar.cs }
