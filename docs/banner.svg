<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Local Broadcast for Jellyfin</title>
  <desc id="desc">A broadcast tower sending signal waves, next to the project name and tagline.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#24124a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#sky)"/>
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M168 108 a44 44 0 0 1 0 62" stroke-width="7" opacity=".95"/>
    <path d="M190 88 a74 74 0 0 1 0 102" stroke-width="7" opacity=".75"/>
    <path d="M212 68 a104 104 0 0 1 0 142" stroke-width="7" opacity=".55"/>
