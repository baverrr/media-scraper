  </g>
  <circle cx="148" cy="139" r="12" fill="#00a4dc"/>
  <text x="290" y="150" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700">Local Broadcast</text>
  <text x="292" y="196" fill="#b7c3d6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28">Your local TV stations in Jellyfin Live TV, local sports first</text>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600">
